
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity Web Player | 2DShooter</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">2DShooter</div>
    </div>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(message, type) {
      const banner = document.querySelector("#unity-warning");
      const div = document.createElement("div");
      div.textContent = message;
      div.style.padding = "10px";

      if (type === "error") {
        div.style.background = "red";
      } else if (type === "warning") {
        div.style.background = "yellow";
        setTimeout(() => {
          if (banner.contains(div)) banner.removeChild(div);
        }, 5000);
      }

      banner.appendChild(div);
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/webGL.loader.js";
    const config = {
      arguments: [],
      dataUrl: buildUrl + "/webGL.data",
      frameworkUrl: buildUrl + "/webGL.framework.js",
      codeUrl: buildUrl + "/webGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "2DShooter",
      productVersion: "1.0",
      showBanner: unityShowBanner,
      // errorHandler: function(err, url, line) {
      //    alert("error " + err + " occurred at line " + line);
      //    // Return 'true' if you handled this error and don't want Unity
      //    // to process it further, 'false' otherwise.
      //    return true;
      // },
    };

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/webGL.loader.js";

    const config = {
      arguments: [],
      dataUrl: buildUrl + "/webGL.data.br",
      frameworkUrl: buildUrl + "/webGL.framework.js.br",
      codeUrl: buildUrl + "/webGL.wasm.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "2DShooter",
      productVersion: "1.0",
      showBanner: unityShowBanner,
      decompressionFallback: true
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

    document.querySelector("#unity-loading-bar").style.display = "block";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width =
          (100 * progress) + "%";
      }).then((unityInstance) => {
        document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      }).catch((error) => {
        console.error(error);
        unityShowBanner("Failed to load the game. Check the browser console for details.", "error");
      });
    };

    script.onerror = () => {
      unityShowBanner("Could not load the Unity loader file.", "error");
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
